name: Agent Transport Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: npm run check
      - name: Mock tests (no modem, no network secrets)
        run: npm test
